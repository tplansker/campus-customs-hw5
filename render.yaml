# Render Blueprint for HW5: one web service runs the MCP server + FastAPI agent team (hw5/) and serves
# the built React board, so the whole desk is one URL.
# Secrets marked sync:false are entered in the Render dashboard (never committed).
services:
  - type: web
    name: campus-customs-hw5
    runtime: python
    plan: free
    rootDir: hw5
    # Builds the React board if npm is available, otherwise uses the committed frontend/dist.
    buildCommand: (command -v npm >/dev/null 2>&1 && cd frontend && npm ci && npm run build || echo "using committed frontend/dist") && pip install -r requirements.txt
    startCommand: ./render_start.sh
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: NODE_VERSION
        value: 22.12.0
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: CAMPUS_DB_PATH
        value: data/campus_customs_new.db
      - key: PORTKEY_API_KEY
        sync: false
      - key: DESK_PASSWORD
        sync: false
